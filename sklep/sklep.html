<body>
    <h1>Dodaj Produkt</h1>
    <form action="dodaj_produkt.php" method="POST">
        <label for="nazwa">nazwa:</label>
        <input type="text" id="nazwa" name="nazwa" required><br><br>

        <label for="cena">cena:</label>
        <input type="number" id="cena" name="cena" step="0.01" required><br><br>

        <label for="opis">opis:</label>
        <textarea id="opis" name="opis" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Dodaj Produkt">
    </form>
</body>
